name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Repository privacy scan, script tests, release build, swift test.
      # Uses only synthetic fixtures; no user archive is required.
      - name: Run CI gate
        run: scripts/check.sh
